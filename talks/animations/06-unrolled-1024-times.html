<!doctype html>
<meta charset="utf-8">
<title>Unrolled 1024 times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

  :root {
    --ground:#F1F0EC; --surface:#FFFFFF; --sunk:#E5E4DF;
    --ink:#171B24; --muted:#656B7A; --line:#D2D1CB;
    --primary:#4C6285; --on-primary:#FFF;
    --signal:#1B62D6; --miss:#B02A1E; --hit:#1B7F4B; --signal-soft:#DCE7FA;
    --f-display:"Bricolage Grotesque",system-ui,sans-serif;
    --f-body:"Public Sans",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    --u:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#12141A; --surface:#1A1D25; --sunk:#0D0F14;
      --ink:#ECEDF1; --muted:#9AA0AE; --line:#2C303B;
      --primary:#93A9C9; --on-primary:#12141A;
      --signal:#6FA8FF; --miss:#F0796B; --hit:#5FCB92; --signal-soft:#16283F;
    }
  }
  :root[data-theme="dark"] {
    --ground:#12141A; --surface:#1A1D25; --sunk:#0D0F14;
    --ink:#ECEDF1; --muted:#9AA0AE; --line:#2C303B;
    --primary:#93A9C9; --on-primary:#12141A;
    --signal:#6FA8FF; --miss:#F0796B; --hit:#5FCB92; --signal-soft:#16283F;
  }

  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
    font-family:var(--f-body);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u)*1.5); padding:calc(var(--u)*3);
  }
  header { text-align:center; }
  .eyebrow {
    font-family:var(--f-mono); font-size:calc(var(--u)*1.15); letter-spacing:.08em;
    text-transform:uppercase; color:var(--signal); margin-bottom:calc(var(--u)*.6);
  }
  h1 { font-family:var(--f-display); font-size:calc(var(--u)*3.2); margin:0; font-weight:800; letter-spacing:-.02em; }
  .stage { width:100%; max-width:980px; }
  svg { width:100%; height:auto; display:block; }
  .controls { display:flex; gap:calc(var(--u)*.6); align-items:center; font-family:var(--f-mono); font-size:calc(var(--u)*1.15); color:var(--muted); }
  button {
    font-family:var(--f-mono); font-size:calc(var(--u)*1.15);
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:calc(var(--u)*.35) calc(var(--u)*.9); cursor:pointer;
  }
  button:hover { color:var(--ink); border-color:var(--muted); }
  button:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

  /* ---- diagram idiom, same as the deck ---- */
  .box   { fill:var(--surface); stroke:var(--line); stroke-width:1.5; }
  .box.pri { stroke:var(--primary); }
  .box.acc { stroke:var(--signal); }
  .t     { fill:var(--ink); font-family:var(--f-body); font-size:13px; font-weight:600; }
  .s     { fill:var(--muted); font-family:var(--f-mono); font-size:10.5px; }
  .mono  { fill:var(--ink); font-family:var(--f-mono); font-size:12px; }
  .lab   { fill:var(--muted); font-family:var(--f-mono); font-size:10px; }
  .l     { stroke:var(--muted); stroke-width:1.5; fill:none; }
  .l.acc { stroke:var(--signal); stroke-width:2; }
  .arrow { fill:var(--muted); stroke:none; }
  .eq    { fill:var(--ink); font-family:var(--f-mono); font-size:15px; font-weight:500; }
  .plane { fill:var(--primary); fill-opacity:.07; stroke:var(--primary); stroke-width:1; stroke-opacity:.45; }
  .shared{ stroke-width:3.5; }
  .node  { fill:var(--signal); }
  .ra    { fill:none; stroke:var(--muted); stroke-width:1.2; }
  .l.t1  { stroke:var(--ink); stroke-width:2; }
  .eq .op { fill:var(--muted); }
  .hl    { fill:var(--signal); }
  .dim   { fill:var(--primary); }

  /* Every animated element is invisible until the timeline reaches it, so a
     still frame of the finished state is never what you see first. */
  .anim { opacity:0; transform-box:fill-box; transform-origin:center; }
  /* Fill-mode is written into every shorthand below rather than set here:
     an `animation:` shorthand resets any longhand that precedes it, so a
     separate animation-fill-mode rule is silently discarded. */
  .run .anim { animation-timing-function:cubic-bezier(.22,.61,.36,1); }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeOut { from{opacity:1} to{opacity:0} }
  @keyframes riseIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  @keyframes drawIn { from{opacity:0; stroke-dashoffset:var(--len)} to{opacity:1; stroke-dashoffset:0} }
  @keyframes growUp { from{opacity:0; transform:scaleY(0)} to{opacity:1; transform:scaleY(1)} }
  @keyframes popIn { from{opacity:0; transform:scale(.7)} to{opacity:1; transform:scale(1)} }

  .anim.tr { transform-box:fill-box; }
  .sub { margin:calc(var(--u)*.8) 0 0; color:var(--muted); font-size:calc(var(--u)*1.35); max-width:60ch; }


  .controls { display:flex; gap:calc(var(--u)*.8); align-items:center; flex-wrap:wrap;
              justify-content:center; font-family:var(--f-mono);
              font-size:calc(var(--u)*1.15); color:var(--muted); }
  .speed { display:flex; align-items:center; gap:calc(var(--u)*.5); }
  .speed input[type=range] { width:150px; accent-color:var(--signal); }
  .speed output { font-variant-numeric:tabular-nums; min-width:3.4em; }

  .run .s6-tile  { animation:fadeIn .30s calc(0.0s + var(--i)*.030s) both; }
  .run .s6-count { animation:fadeIn .35s 0.9s both; }
  .run .s6-rec   { animation:riseIn .45s 0.1s both; }
  .run .s6-eqn   { animation:riseIn .45s 1.7s both; }
  .run .s6-rule  { animation:fadeIn .40s 2.6s both; }
  .run .s6-cos   { animation:riseIn .50s 2.8s both; }
  @media (prefers-reduced-motion: reduce) {
    .anim { opacity:1 !important; }
    .run .anim { animation:none !important both; }
    
  }
</style>

<header>
  <div class="eyebrow">Distance, in the end</div>
  <h1>Unrolled 1024 times</h1>
  <p class="sub">The recursion collapses into a single sum — and into one SQL operator.</p>
</header>

<div class="stage">
<svg id="fig" viewBox="0 0 980 430" role="img" aria-label="Three stages. First, the sentence 'the cat sat on the mat' is tokenised and embedded by mxbai-embed-large into a 1024-element unit vector. Second, Pythagoras: in two dimensions d squared equals delta-one squared plus delta-two squared; a third perpendicular axis adds delta-three squared. Third, the same sum generalised to 1024 terms, giving Euclidean distance; and because the vectors are unit length, d squared equals 2 times 1 minus cosine theta, which is what the pgvector cosine-distance operator computes.">
<g class="scene" data-scene="6">
    <!-- 32 x 32 = 1024, drawn in full. Sqrt(1024) = 32, so the grid is also
         literally the answer when every component is 1. -->
    <g id="tiles"></g>
    <text class="lab s6-count anim" id="counter" x="208" y="392" text-anchor="middle">1024 terms</text>

    <text class="s s6-rec anim" x="440" y="96">Keep going. Every new dimension does the same thing:</text>
    <text class="eq s6-rec anim" x="460" y="130">d₂² = x₁² + x₂²</text>
    <text class="eq s6-rec anim" x="460" y="158">d₃² = d₂² + x₃²</text>
    <text class="eq s6-rec anim" x="460" y="186">d₄² = d₃² + x₄²</text>
    <text class="lab s6-rec anim" x="460" y="208">⋮</text>
    <text class="eq s6-rec anim hl" x="460" y="236">dₖ² = dₖ₋₁² + xₖ²</text>
    <text class="s s6-rec anim" x="640" y="236">← the previous distance, as a leg</text>

    <text class="s s6-eqn anim" x="440" y="278">Unroll it 1024 times and the nesting collapses:</text>
    <text class="eq s6-eqn anim" x="460" y="316">d(a,b) = √( Σ (aᵢ − bᵢ)² )</text>
    <text class="lab s6-eqn anim" x="572" y="298">1024</text>
    <text class="lab s6-eqn anim" x="568" y="332">i = 1</text>

    <line class="l s6-rule anim" x1="440" y1="352" x2="940" y2="352"/>
    <text class="eq s6-cos anim hl" x="440" y="382">d² = 2(1 − cos θ)</text>
    <text class="s s6-cos anim" x="620" y="374">for unit vectors — so ranking by distance</text>
    <text class="s s6-cos anim" x="620" y="392">is ranking by angle:  ORDER BY v &lt;=&gt; q</text>
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay">↻ replay</button>
  <button id="theme">◐ theme</button>
  <span class="speed">
    <label for="rate">speed</label>
    <input id="rate" type="range" min="0.10" max="1.50" step="0.01" value="0.33">
    <output id="rateout">0.33×</output>
  </span>
  <span id="clock">0.0s</span>
</div>

<script>
  (function buildTiles () {
    const g = document.getElementById('tiles');
    // 32 x 32 grid sized to finish inside the 430-unit viewBox: 32 * 9.5 = 304.
    const N = 32, size = 8, gap = 1.5, x0 = 56, y0 = 66;
    const frag = document.createDocumentFragment();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const i = r * N + c;
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', x0 + c * (size + gap));
        el.setAttribute('y', y0 + r * (size + gap));
        el.setAttribute('width', size);
        el.setAttribute('height', size);
        el.setAttribute('class', 's6-tile anim');
        // The first three are the axes we just drew by hand, so they carry the
        // accent — the other 1021 are the same idea, repeated.
        el.setAttribute('fill', i < 3 ? 'var(--signal)' : 'var(--primary)');
        el.setAttribute('opacity', '0');
        // Stagger by ring rather than index, so it grows outward instead of
        // wiping line by line.
        el.style.setProperty('--i', Math.max(r, c));
        frag.appendChild(el);
      }
    }
    g.appendChild(frag);
  })();

  const fig = document.getElementById('fig');
  const clock = document.getElementById('clock');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = 3.6;
  let raf = 0, t0 = 0;

  // Rate control via the Web Animations API rather than rewriting durations:
  // playbackRate scales CSS animations already in flight, so the slider is live.
  const rateEl = document.getElementById('rate');
  const rateOut = document.getElementById('rateout');
  let rate = 0.33;
  try { const v = localStorage.getItem('anim-rate'); if (v) rate = +v; } catch (e) {}
  rateEl.value = rate;

  function applyRate (r) {
    rate = r;
    rateOut.textContent = r.toFixed(2) + '×';
    for (const a of fig.getAnimations({ subtree: true })) a.playbackRate = r;
    try { localStorage.setItem('anim-rate', String(r)); } catch (e) {}
  }
  rateEl.addEventListener('input', () => applyRate(+rateEl.value));

  function tick (now) {
    const t = ((now - t0) / 1000) * rate;      // scene time, not wall time
    clock.textContent = Math.min(t, DUR).toFixed(1) + 's / ' + DUR + 's';
    if (t < DUR + 0.3) raf = requestAnimationFrame(tick);
  }
  function play () {
    cancelAnimationFrame(raf);
    fig.classList.remove('run');
    void fig.getBoundingClientRect();
    fig.classList.add('run');
    applyRate(rate);
    if (!reduced) { t0 = performance.now(); raf = requestAnimationFrame(tick); }
    else { clock.textContent = 'static'; }
  }
  document.getElementById('replay').addEventListener('click', play);
  document.getElementById('theme').addEventListener('click', () => {
    const g = getComputedStyle(document.documentElement).getPropertyValue('--ground').trim().toLowerCase();
    document.documentElement.setAttribute('data-theme', g === '#12141a' ? 'light' : 'dark');
  });
  play();
</script>
