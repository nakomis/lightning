<!doctype html>
<meta charset="utf-8">
<title>Distance in 1024 dimensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:#F1F0EC; --surface:#FFFFFF; --sunk:#E5E4DF;
    --ink:#171B24; --muted:#656B7A; --line:#D2D1CB;
    --primary:#3B3AA8; --on-primary:#FFF;
    --signal:#C24A16; --signal-soft:#F6E2D6;
    --f-display:"Bricolage Grotesque",system-ui,sans-serif;
    --f-body:"Public Sans",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    --u:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#12141A; --surface:#1A1D25; --sunk:#0D0F14;
      --ink:#ECEDF1; --muted:#9AA0AE; --line:#2C303B;
      --primary:#8C8BEE; --on-primary:#12141A;
      --signal:#F0834E; --signal-soft:#3A2418;
    }
  }
  :root[data-theme="dark"] {
    --ground:#12141A; --surface:#1A1D25; --sunk:#0D0F14;
    --ink:#ECEDF1; --muted:#9AA0AE; --line:#2C303B;
    --primary:#8C8BEE; --on-primary:#12141A;
    --signal:#F0834E; --signal-soft:#3A2418;
  }

  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
    font-family:var(--f-body);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u)*1.5); padding:calc(var(--u)*3);
  }
  header { text-align:center; }
  .eyebrow {
    font-family:var(--f-mono); font-size:calc(var(--u)*1.15); letter-spacing:.08em;
    text-transform:uppercase; color:var(--signal); margin-bottom:calc(var(--u)*.6);
  }
  h1 { font-family:var(--f-display); font-size:calc(var(--u)*3.2); margin:0; font-weight:800; letter-spacing:-.02em; }
  .stage { width:100%; max-width:980px; }
  svg { width:100%; height:auto; display:block; }
  .controls { display:flex; gap:calc(var(--u)*.6); align-items:center; font-family:var(--f-mono); font-size:calc(var(--u)*1.15); color:var(--muted); }
  button {
    font-family:var(--f-mono); font-size:calc(var(--u)*1.15);
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:calc(var(--u)*.35) calc(var(--u)*.9); cursor:pointer;
  }
  button:hover { color:var(--ink); border-color:var(--muted); }
  button:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

  /* ---- diagram idiom, same as the deck ---- */
  .box   { fill:var(--surface); stroke:var(--line); stroke-width:1.5; }
  .box.pri { stroke:var(--primary); }
  .box.acc { stroke:var(--signal); }
  .t     { fill:var(--ink); font-family:var(--f-body); font-size:13px; font-weight:600; }
  .s     { fill:var(--muted); font-family:var(--f-mono); font-size:10.5px; }
  .mono  { fill:var(--ink); font-family:var(--f-mono); font-size:12px; }
  .lab   { fill:var(--muted); font-family:var(--f-mono); font-size:10px; }
  .l     { stroke:var(--muted); stroke-width:1.5; fill:none; }
  .l.acc { stroke:var(--signal); stroke-width:2; }
  .arrow { fill:var(--muted); stroke:none; }
  .eq    { fill:var(--ink); font-family:var(--f-mono); font-size:15px; font-weight:500; }
  .eq .op { fill:var(--muted); }
  .hl    { fill:var(--signal); }
  .dim   { fill:var(--primary); }

  /* Every animated element is invisible until the timeline reaches it, so a
     still frame of the finished state is never what you see first. */
  .anim { opacity:0; transform-box:fill-box; transform-origin:center; }
  /* Fill-mode is written into every shorthand below rather than set here:
     an `animation:` shorthand resets any longhand that precedes it, so a
     separate animation-fill-mode rule is silently discarded. */
  .run .anim { animation-timing-function:cubic-bezier(.22,.61,.36,1); }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeOut { from{opacity:1} to{opacity:0} }
  @keyframes riseIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  @keyframes drawIn { from{opacity:0; stroke-dashoffset:var(--len)} to{opacity:1; stroke-dashoffset:0} }
  @keyframes growUp { from{opacity:0; transform:scaleY(0)} to{opacity:1; transform:scaleY(1)} }
  @keyframes popIn { from{opacity:0; transform:scale(.7)} to{opacity:1; transform:scale(1)} }

  .anim.tr { transform-box:fill-box; }

  /* ================= ACT 1 : text -> vector  (0 - 5.0s) ================= */
  .run .a1-src   { animation:riseIn .45s .10s both; }
  .run .a1-tok   { animation:popIn .30s calc(.70s + var(--i)*.09s) both; transform-origin:center; }
  .run .a1-arrow { animation:fadeIn .35s 1.45s both; }
  .run .a1-model { animation:riseIn .40s 1.55s both; }
  .run .a1-col   { animation:riseIn .40s calc(2.15s + var(--i)*.055s) both; }
  .run .a1-brack { animation:fadeIn .40s 2.75s both; }
  .run .a1-note  { animation:fadeIn .45s 3.20s both; }
  .run .act1     { animation:fadeOut .40s 4.75s forwards; }

  /* ================= ACT 2 : 2D -> 3D  (5.0 - 10.2s) =================== */
  .run .a2-tri   { animation:drawIn .70s 5.15s both; }
  .run .a2-sq1   { animation:popIn .40s 5.90s both; transform-origin:center; }
  .run .a2-sq2   { animation:popIn .40s 6.10s both; transform-origin:center; }
  .run .a2-sqh   { animation:popIn .45s 6.35s both; transform-origin:center; }
  .run .a2-eq2   { animation:riseIn .40s 6.75s both; }
  .run .a2-axis3 { animation:drawIn .55s 7.55s both; }
  .run .a2-sq3   { animation:popIn .45s 8.05s both; transform-origin:center; }
  .run .a2-eq3   { animation:riseIn .45s 8.45s both; }
  .run .a2-lab   { animation:fadeIn .40s 8.85s both; }
  .run .act2     { animation:fadeOut .40s 9.95s forwards; }

  /* ================= ACT 3 : -> 1024D  (10.2 - 15.0s) ================== */
  .run .a3-tile  { animation:fadeIn .30s calc(10.35s + var(--i)*.035s) both; }
  .run .a3-eqn   { animation:riseIn .50s 11.30s both; }
  .run .a3-count { animation:fadeIn .35s 11.30s both; }
  .run .a3-rule  { animation:fadeIn .40s 12.55s both; }
  .run .a3-cos   { animation:riseIn .50s 12.75s both; }
  .run .a3-op    { animation:riseIn .45s 13.60s both; }

  @media (prefers-reduced-motion: reduce) {
    .anim { opacity:1 !important; }
    .run .anim { animation:none !important both; }
    .run .act1, .run .act2 { opacity:0 !important; }
  }
</style>

<header>
  <div class="eyebrow">How recall actually works</div>
  <h1>Distance in 1024 dimensions</h1>
</header>

<div class="stage">
<svg id="fig" viewBox="0 0 980 430" role="img"
     aria-label="Three stages. First, the sentence 'the cat sat on the mat' is tokenised and embedded by mxbai-embed-large into a 1024-element unit vector. Second, Pythagoras: in two dimensions d squared equals delta-one squared plus delta-two squared; a third perpendicular axis adds delta-three squared. Third, the same sum generalised to 1024 terms, giving Euclidean distance; and because the vectors are unit length, d squared equals 2 times 1 minus cosine theta, which is what the pgvector cosine-distance operator computes.">

  <!-- ============================ ACT 1 ============================ -->
  <g class="act1">

    <text class="s a1-src anim" x="40" y="42">input message</text>
    <g class="a1-src anim">
      <rect class="box" x="34" y="54" width="330" height="38" rx="5"/>
      <text class="mono" x="50" y="78">"the cat sat on the mat"</text>
    </g>

    <!-- tokenised: one box per token, real widths -->
    <g>
      <rect class="box pri a1-tok anim tr" style="--i:0" x="34"  y="118" width="42" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:0" x="55"  y="135" text-anchor="middle">the</text>
      <rect class="box pri a1-tok anim tr" style="--i:1" x="82"  y="118" width="42" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:1" x="103" y="135" text-anchor="middle">cat</text>
      <rect class="box pri a1-tok anim tr" style="--i:2" x="130" y="118" width="42" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:2" x="151" y="135" text-anchor="middle">sat</text>
      <rect class="box pri a1-tok anim tr" style="--i:3" x="178" y="118" width="34" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:3" x="195" y="135" text-anchor="middle">on</text>
      <rect class="box pri a1-tok anim tr" style="--i:4" x="218" y="118" width="42" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:4" x="239" y="135" text-anchor="middle">the</text>
      <rect class="box pri a1-tok anim tr" style="--i:5" x="266" y="118" width="42" height="26" rx="4"/>
      <text class="lab a1-tok anim"        style="--i:5" x="287" y="135" text-anchor="middle">mat</text>
      <text class="s a1-tok anim"          style="--i:6" x="320" y="136">6 tokens</text>
    </g>

    <!-- embedder -->
    <g class="a1-arrow anim">
      <path class="l" d="M198 152 L198 178"/>
      <path class="arrow" d="M198 186 l-4.5 -9 h9 z"/>
    </g>
    <g class="a1-model anim">
      <rect class="box acc" x="70" y="188" width="256" height="46" rx="5"/>
      <text class="t"    x="198" y="209" text-anchor="middle">mxbai-embed-large</text>
      <text class="s"    x="198" y="226" text-anchor="middle">local, via Ollama · 1024-d output</text>
    </g>
    <!-- Elbow across to the vector, so the output of the embedder is visibly
         the thing on the right rather than an arrow into blank space. -->
    <g class="a1-arrow anim">
      <path class="l" d="M198 240 L198 336 L446 336"/>
      <path class="arrow" d="M454 336 l-9 -4.5 v9 z"/>
    </g>

    <!-- the vector itself -->
    <g class="a1-brack anim">
      <path class="l" d="M470 292 l-9 0 l0 96 l9 0"/>
      <path class="l" d="M812 292 l9 0 l0 96 l-9 0"/>
      <text class="lab" x="836" y="344">1024</text>
    </g>
    <g>
      <text class="mono a1-col anim" style="--i:0"  x="480" y="322">0.0214</text>
      <text class="mono a1-col anim" style="--i:1"  x="551" y="322">-0.1183</text>
      <text class="mono a1-col anim" style="--i:2"  x="630" y="322">0.3341</text>
      <text class="mono a1-col anim" style="--i:3"  x="701" y="322">-0.0472</text>
      <text class="mono a1-col anim" style="--i:4"  x="480" y="352">0.1907</text>
      <text class="mono a1-col anim" style="--i:5"  x="551" y="352">0.0663</text>
      <text class="mono a1-col anim" style="--i:6"  x="630" y="352">-0.2250</text>
      <text class="mono a1-col anim" style="--i:7"  x="701" y="352">0.0119</text>
      <text class="mono a1-col anim" style="--i:8"  x="480" y="382">-0.0836</text>
      <text class="mono a1-col anim" style="--i:9"  x="560" y="382">0.2714</text>
      <text class="lab  a1-col anim" style="--i:10" x="640" y="382">… 1014 more</text>
    </g>
    <text class="s a1-note anim" x="470" y="270">one message → one point in ℝ¹⁰²⁴</text>
    <g class="a1-note anim">
      <text class="s" x="470" y="410">L2-normalised, so ‖v‖ = 1 — every message lands on the unit hypersphere</text>
    </g>
  </g>

  <!-- ============================ ACT 2 ============================ -->
  <g class="act2">
    <!-- Squares first, triangle last, so the figure sits on top of its own
         construction rather than being buried by it. -->

    <!-- square on leg 1 (below the base) -->
    <g class="a2-sq1 anim tr">
      <rect class="box pri" x="170" y="250" width="120" height="120"/>
      <text class="lab" x="230" y="316" text-anchor="middle">Δ₁² = 14400</text>
    </g>
    <!-- square on leg 2 (right of the upright) -->
    <g class="a2-sq2 anim tr">
      <rect class="box pri" x="290" y="160" width="90" height="90"/>
      <text class="lab" x="335" y="234" text-anchor="middle">Δ₂² = 8100</text>
    </g>
    <!-- square on the hypotenuse: anchored at C, width running back along C→A,
         which puts it on the far side of AC from B. -->
    <g class="a2-sqh anim tr">
      <rect class="box acc" x="290" y="160" width="150" height="150"
            transform="rotate(143.13 290 160)"/>
      <text class="lab hl" x="185" y="145" text-anchor="middle">d² = 22500</text>
    </g>

    <!-- third axis, projected down-right so it clears the Δ₁² square -->
    <g class="a2-sq3 anim tr">
      <path class="box acc" d="M290 250 L368 314 L368 394 L290 330 Z"/>
      <text class="lab" x="329" y="338" text-anchor="middle">Δ₃²</text>
    </g>
    <g class="a2-axis3 anim" style="--len:101">
      <path class="l" style="stroke-dasharray:101" d="M290 250 L368 314"/>
    </g>
    <text class="lab a2-axis3 anim" x="374" y="300">Δ₃</text>

    <!-- the triangle itself, on top -->
    <g class="a2-tri anim" style="--len:360">
      <path class="l acc" style="stroke-dasharray:360" d="M170 250 L290 250 L290 160 Z"/>
    </g>
    <text class="lab a2-tri anim" x="230" y="264" text-anchor="middle">Δ₁ = 120</text>
    <text class="lab a2-tri anim" x="296" y="180">Δ₂ = 90</text>
    <text class="lab a2-tri anim hl" x="243" y="216" text-anchor="middle">d = 150</text>

    <text class="eq a2-eq2 anim" x="470" y="150">2D</text>
    <text class="eq a2-eq2 anim" x="510" y="150">d² = Δ₁² + Δ₂²</text>
    <text class="lab a2-eq2 anim" x="510" y="170">14400 + 8100 = 22500 = 150²</text>

    <text class="eq a2-eq3 anim" x="470" y="230">3D</text>
    <text class="eq a2-eq3 anim" x="510" y="230">d² = Δ₁² + Δ₂² + Δ₃²</text>
    <text class="lab a2-lab anim" x="510" y="252">one more axis · one more square · one more term</text>
    <text class="s a2-lab anim" x="510" y="292">Nothing about the identity cares how many axes there are.</text>
    <text class="s a2-lab anim" x="510" y="312">It was never a fact about triangles — it is a fact about</text>
    <text class="s a2-lab anim" x="510" y="332">perpendicular components adding in quadrature.</text>
  </g>

  <!-- ============================ ACT 3 ============================ -->
  <g class="act3">
    <!-- 32 x 32 = 1024 tiles, drawn for real -->
    <g id="tiles"></g>
    <text class="lab a3-count anim" id="counter" x="208" y="392" text-anchor="middle">1024 terms</text>

    <text class="eq a3-eqn anim" x="440" y="130">nD</text>
    <text class="eq a3-eqn anim" x="480" y="130">d(a,b) = √( Σ (aᵢ − bᵢ)² )</text>
    <text class="lab a3-eqn anim" x="592" y="112">1024</text>
    <text class="lab a3-eqn anim" x="588" y="146">i = 1</text>
    <text class="s a3-eqn anim" x="480" y="172">Euclidean distance — Pythagoras, 1024 terms deep.</text>

    <line class="l a3-rule anim" x1="440" y1="204" x2="940" y2="204"/>

    <text class="eq a3-cos anim" x="440" y="240">Because ‖a‖ = ‖b‖ = 1 :</text>
    <text class="eq a3-cos anim hl" x="480" y="276">d² = 2(1 − cos θ)</text>
    <text class="s a3-cos anim" x="480" y="300">Distance and angle are the same measurement wearing</text>
    <text class="s a3-cos anim" x="480" y="318">different clothes. Rank by one, you have ranked by the other.</text>

    <g class="a3-op anim">
      <rect class="box acc" x="440" y="340" width="500" height="60" rx="5"/>
      <text class="mono" x="460" y="366">ORDER BY embedding &lt;=&gt; query_vec LIMIT 10</text>
      <text class="s"    x="460" y="386">pgvector's cosine-distance operator — this is the whole of semantic search</text>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay">↻ replay</button>
  <button id="theme">◐ theme</button>
  <span id="clock">0.0s</span>
</div>

<script>
  // 1024 tiles, actually drawn — 32 x 32. The point of the act is that the
  // number is large, so drawing a token handful would undercut it.
  (function buildTiles () {
    const g = document.getElementById('tiles');
    // 32 x 32 grid sized to finish inside the 430-unit viewBox: 32 * 9.5 = 304.
    const N = 32, size = 8, gap = 1.5, x0 = 56, y0 = 66;
    const frag = document.createDocumentFragment();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const i = r * N + c;
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', x0 + c * (size + gap));
        el.setAttribute('y', y0 + r * (size + gap));
        el.setAttribute('width', size);
        el.setAttribute('height', size);
        el.setAttribute('class', 'a3-tile anim');
        // The first three are the axes we just drew by hand, so they carry the
        // accent — the other 1021 are the same idea, repeated.
        el.setAttribute('fill', i < 3 ? 'var(--signal)' : 'var(--primary)');
        el.setAttribute('opacity', '0');
        // Stagger by ring rather than index, so it grows outward instead of
        // wiping line by line.
        el.style.setProperty('--i', Math.max(r, c));
        frag.appendChild(el);
      }
    }
    g.appendChild(frag);
  })();

  const fig = document.getElementById('fig');
  const clock = document.getElementById('clock');
  const counter = document.getElementById('counter');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0, t0 = 0;

  function tick (now) {
    const t = (now - t0) / 1000;
    clock.textContent = Math.min(t, 15).toFixed(1) + 's';
    // The counter races 3 → 1024 as the tiles land, so the number is seen to
    // grow rather than merely asserted.
    if (t >= 10.35 && t < 12.4) {
      const p = Math.min((t - 10.35) / 1.6, 1);
      const n = Math.round(3 + (1024 - 3) * p * p);
      counter.textContent = n + (n === 1024 ? ' terms' : ' terms');
    }
    if (t < 15.4) raf = requestAnimationFrame(tick);
  }

  function play () {
    cancelAnimationFrame(raf);
    fig.classList.remove('run');
    counter.textContent = '3 terms';
    void fig.getBoundingClientRect();      // force reflow so the restart takes
    fig.classList.add('run');
    if (!reduced) { t0 = performance.now(); raf = requestAnimationFrame(tick); }
    else { clock.textContent = 'static'; counter.textContent = '1024 terms'; }
  }

  document.getElementById('replay').addEventListener('click', play);

  document.getElementById('theme').addEventListener('click', () => {
    // Read the computed token rather than matchMedia — the two disagree once
    // an explicit choice has been stamped on the root.
    const ground = getComputedStyle(document.documentElement)
      .getPropertyValue('--ground').trim().toLowerCase();
    const isDark = ground === '#12141a';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  play();
</script>
